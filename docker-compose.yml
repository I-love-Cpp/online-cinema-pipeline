services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    depends_on:
      - kafka
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081

  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - kafka
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo 'Waiting for Kafka...'
        until kafka-topics --bootstrap-server kafka:29092 --list >/dev/null 2>&1; do sleep 2; done
        kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --topic movie-events --partitions 3 --replication-factor 1
        echo 'Topic movie-events created (3 partitions)'

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports:
      - "8123:8123"
      - "9000:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      CLICKHOUSE_USER: cinema
      CLICKHOUSE_PASSWORD: cinema_pass
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --header='X-ClickHouse-User: cinema' --header='X-ClickHouse-Key: cinema_pass' 'http://localhost:8123/ping' >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    volumes:
      - ./clickhouse/init:/docker-entrypoint-initdb.d
      - clickhouse-data:/var/lib/clickhouse
    depends_on:
      - kafka
      - schema-registry

  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinema -d cinema_metrics"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      POSTGRES_DB: cinema_metrics
      POSTGRES_USER: cinema
      POSTGRES_PASSWORD: cinema_secret
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d
      - pg-data:/var/lib/postgresql/data

  producer:
    build: ./producer
    ports:
      - "8000:8000"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      TOPIC: movie-events
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      schema-registry:
        condition: service_started

  aggregation:
    build: ./aggregation
    ports:
      - "8001:8001"
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: cinema
      CLICKHOUSE_PASSWORD: cinema_pass
      POSTGRES_DSN: postgresql://cinema:cinema_secret@postgres:5432/cinema_metrics
      AGGREGATION_INTERVAL_SECONDS: "3600"
    depends_on:
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy

  tests:
    build: ./tests
    environment:
      PRODUCER_URL: http://producer:8000
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: cinema
      CLICKHOUSE_PASSWORD: cinema_pass
    depends_on:
      producer:
        condition: service_started
      clickhouse:
        condition: service_healthy
    profiles: ["test"]

volumes:
  clickhouse-data:
  pg-data:
